:root { color-scheme: dark; }
html, body { margin: 0; height: 100%; background: #0b0b0c; }
body { display: grid; place-items: center; font-family: var(--font); -webkit-tap-highlight-color: transparent; overflow: hidden; }
#phone { position: relative; width: 390px; height: 844px; border-radius: 48px; overflow: hidden; background: #1c1d20; box-shadow: 0 0 0 10px #050506, 0 0 0 11px #2a2b2f, 0 32px 80px rgba(0,0,0,.6); transform-origin: center; isolation: isolate; }
.screen { position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; transition: transform .36s cubic-bezier(.2,.8,.2,1), opacity .36s ease; will-change: transform; }
.screen::-webkit-scrollbar { display: none; }
.screen > .scr, .screen > .scr.tall { height: auto; min-height: 100%; }
.screen.enter-r { transform: translateX(100%); } .screen.enter-l { transform: translateX(-28%); opacity: .6; }
.screen.leave-l { transform: translateX(-28%); opacity: .6; } .screen.leave-r { transform: translateX(100%); }
.screen.fade-in { opacity: 0; } .screen.leave-fade { opacity: 0; }
/* V18 · overgangen: binnen een flow blijft de kop staan en wisselt alleen de inhoud; de zwerm schuift door naar zijn nieuwe plek */
.screen.clear > .scr { background: transparent; }
.screen.anim > .scr > :not(.sbar):not(.hind), .screen.anim > .scr > :is(.body, .alarm-body, .hbody) > * { transition: opacity .3s ease, transform .46s cubic-bezier(.2,.8,.2,1); }
.screen.anim > .scr > :is(.body, .alarm-body, .hbody) { transition: none; }
.screen.st-in > .scr > :not(.sbar):not(.hind):not(.body):not(.alarm-body):not(.hbody), .screen.st-in > .scr > :is(.body, .alarm-body, .hbody) > *,
.screen.st-out > .scr > :not(.sbar):not(.hind):not(.body):not(.alarm-body):not(.hbody), .screen.st-out > .scr > :is(.body, .alarm-body, .hbody) > * { opacity: 0; transform: translate(var(--dx, 0), var(--dy, 0)); }
.screen.st-in.keephead > .scr > :is(.kop, .webbar):not(.sbar):not(.hind):not(.body):not(.alarm-body):not(.hbody), .screen.st-in.morph > .scr > :is(.body, .alarm-body, .hbody) > .held,
.screen.st-out.morph > .scr > :is(.body, .alarm-body, .hbody) > .held { opacity: 1; transform: none; }
.screen.st-out.keephead > .scr > :is(.kop, .webbar) { opacity: 0; transition: none; }
.screen.st-out.morph > .scr > :is(.body, .alarm-body, .hbody) > .held .zw-lab { opacity: 0; transition: opacity .12s ease; }
.screen.op-in { opacity: 0; transform: scale(.94); }
/* de oude inhoud gaat snel weg, de nieuwe komt net daarna: geen twee titels door elkaar */
.screen.anim.st-out > .scr > :not(.sbar):not(.hind), .screen.anim.st-out > .scr > :is(.body, .alarm-body, .hbody) > * { transition: opacity .14s ease, transform .3s cubic-bezier(.4,0,1,1); }
.screen.anim:not(.st-out) > .scr > :not(.sbar):not(.hind), .screen.anim:not(.st-out) > .scr > :is(.body, .alarm-body, .hbody) > * { transition-delay: .09s, .04s; }
.screen.anim:not(.st-out) > .scr > :is(.body, .alarm-body, .hbody) { transition: none; }
/* V19 · van de splash: de tekst en de knoppen komen pas als de zwerm bijna op zijn plek is */
.screen.anim.late:not(.st-out) > .scr > :not(.sbar):not(.hind), .screen.anim.late:not(.st-out) > .scr > :is(.body, .alarm-body, .hbody) > * { transition: opacity .5s ease .34s, transform .7s cubic-bezier(.2,.8,.2,1) .28s; }
.screen.anim.late:not(.st-out) > .scr > :is(.body, .alarm-body, .hbody) { transition: none; }
.zwh.samelab .zw-lab { animation: none; }
/* op een echte telefoon: volledig scherm, de echte statusbalk en home-indicator van het toestel */
@media (max-width: 500px), (pointer: coarse) and (max-height: 1000px) {
  html, body { background: #1c1d20; }
  body { display: block; }
  #phone { width: 100%; height: 100%; border-radius: 0; box-shadow: none; transform: none !important; }
  .screen .sbar, .screen .hind { display: none; }

}
/* knoppen en links: alles wat je kunt aantikken */
#phone [data-go], #phone [data-back], #phone [data-auto], #phone .row:has(.radio), #phone .chip, #phone .switch, #phone .drow:has(.switch), #phone .row:has(.switch) { cursor: pointer; user-select: none; -webkit-user-select: none; }

#phone .row[data-go]:active, #phone .drow[data-go]:active, #phone .txtbtn:active, #phone .nact:active { opacity: .6; }
/* de zwerm leeft: canvas met het label erop */
.zwh { position: relative; width: 100%; }
.hbody .held { cursor: pointer; -webkit-tap-highlight-color: transparent; }
#phone .chart .tab { cursor: pointer; }
#phone .body > .hero, #phone .body > .card.chart .tb { cursor: pointer; }
.zwh canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.zwh .zw-lab { animation: lab .6s ease both; }
.zw-logo svg { display: block; }
@keyframes lab { from { opacity: 0; } }
.held > a, .held > .zwh { height: 100%; width: 100%; display: block; }
.emb > a { display: block; width: 100%; height: 100%; }
.emb.full .anim { -webkit-mask-image: none; mask-image: none; }   /* heel Ember, zonder uitvaging */
/* de animaties van de site: close-up van Ember, de sticker en de magneetklik */
.emb .anim { position: relative; display: block; width: 100%; height: 100%; overflow: hidden; -webkit-mask-image: linear-gradient(180deg, #000 72%, transparent 100%); mask-image: linear-gradient(180deg, #000 72%, transparent 100%); }
.clip .anim { position: absolute; inset: 0; display: block; }
.clip > a { position: absolute; inset: 0; }
.ea-ember { position: absolute; max-width: none; pointer-events: none; -webkit-user-drag: none; }
.ea-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.clip .cnt { z-index: 2; }
/* kleine bewegingen */
.vf .scan { animation: scan 2.2s ease-in-out infinite alternate; }
@keyframes scan { from { top: 18%; } to { top: 78%; } }
.spin { animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.illus circle:first-of-type { transform-box: fill-box; transform-origin: center; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.5); opacity: .5; } }
.lock .notif { animation: drop .5s .35s cubic-bezier(.2,.8,.2,1) both; }
.lock .nacts { animation: drop .4s .7s ease both; }
.sms .bubble { animation: drop .45s .3s ease both; }
@keyframes drop { from { transform: translateY(-16px); opacity: 0; } }
.dim { animation: fadein .25s ease both; } .dim .alert { animation: pop .3s .05s cubic-bezier(.2,.8,.2,1) both; }
@keyframes fadein { from { opacity: 0; } } @keyframes pop { from { transform: scale(1.12); opacity: 0; } }
.bars i { transform-origin: bottom; animation: grow .7s calc(var(--i) * 18ms) cubic-bezier(.2,.8,.2,1) both; }
@keyframes grow { from { transform: scaleY(0); } }
.tbar i { transition: width .25s linear; }
.drow .check { animation: pop .3s ease both; }
.row .radio, .switch, .switch::after, .chip { transition: background .2s ease, left .2s ease, border-color .2s ease; }
.foot .round.wait { opacity: .35; pointer-events: none; transition: opacity .3s ease; }
/* Ember klikt vast op de VanMoof-foto */
.beeld .vk-vast { opacity: 0; transition: opacity .09s linear; z-index: 3; }
.vk-cover, .vk-glow, .vk-dots { z-index: 4 !important; }
/* Ember los: gemeten in de Figma-foto (zweeft op 53,1% / 22,7%, 31,2% x 49,9%), en vast op 48,4% / 59,9% met 70% van de lengte */
.beeld .vk-los { position: absolute; inset: 22.65% auto auto 53.14%; width: 31.18%; height: 49.9%; z-index: 2; transform-origin: 50.3% 49.9%; animation: vkfloat 2.4s ease-in-out infinite; transition: transform .34s cubic-bezier(.55,0,1,.45), opacity .09s linear .3s; }
@keyframes vkfloat { 50% { translate: 0 -1.2%; } }
.beeld.vk-pull .vk-los { animation: none; transform: translate(-65.4%, 24.75%) rotate(3.4deg) scale(.70); }
.beeld.vk-on .vk-los { opacity: 0; }
.beeld.vk-on .vk-vast { opacity: 1; }
.vk-cover, .vk-glow, .vk-dots { position: absolute; width: 0; height: 0; z-index: 2; pointer-events: none; }
.vk-cover::after { content: ""; position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; border-radius: 22px; background: radial-gradient(circle, rgba(20,21,24,0) 30%, rgba(20,21,24,.92) 52%, rgba(20,21,24,.92) 74%, rgba(20,21,24,0) 80%); opacity: 1; transition: opacity .55s ease; }
.beeld:not(.vk-on) .vk-cover::after { opacity: 0; }
.beeld.vk-wake .vk-cover::after { opacity: 0; }
.vk-glow::after { content: ""; position: absolute; left: -40px; top: -40px; width: 80px; height: 80px; border-radius: 40px; background: radial-gradient(circle, rgba(214,235,219,.42) 0%, rgba(214,235,219,0) 70%); opacity: 0; }
.beeld.vk-wake .vk-glow::after { animation: vkglow 1.1s ease-out both; }
@keyframes vkglow { 30% { opacity: 1; } 100% { opacity: 0; } }
.vk-dots i { position: absolute; left: -2px; top: -2px; width: 4px; height: 4px; border-radius: 2px; background: #d6ebdb; opacity: 0; }
.beeld.vk-wake .vk-dots i { animation: vkdot .8s cubic-bezier(.2,.8,.2,1) both; }
@keyframes vkdot { 0% { opacity: .9; transform: translate(0, 0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
/* de sticker landt */
.stk.pl-start { opacity: 0; transform: translate(-50%, -50%) rotate(-15.5deg) scale(1.33); }
.stk.pl-land { transition: transform .7s cubic-bezier(.2,.8,.2,1), opacity .35s ease; }
.stk.pl-press { animation: plpress 1s ease-in-out infinite; }
@keyframes plpress { 50% { filter: brightness(.93); box-shadow: 0 1px 3px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.5); } }
.otpbox { position: relative; display: block; }
.otpbox input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; border: 0; background: none; color: transparent; caret-color: transparent; }
.otp span.on { border-bottom-color: var(--text); }
/* meldingen van het prototype zelf */
.toast { position: absolute; left: 24px; right: 24px; bottom: 48px; z-index: 50; padding: 12px 16px; border-radius: 16px; background: rgba(48,49,54,.98); color: var(--text); font-size: 12px; line-height: 16px; text-align: center; animation: drop .3s ease both; pointer-events: none; }
.call { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: rgba(12,12,14,.94); animation: fadein .25s ease both; }
.call .ring { width: 96px; height: 96px; border-radius: 48px; background: var(--danger); display: grid; place-items: center; margin-bottom: 16px; animation: pulse 1.2s ease-in-out infinite; }
/* testpaneel voor de testleider */
.sheet-bg { position: absolute; inset: 0; z-index: 60; background: rgba(0,0,0,.5); animation: fadein .2s ease both; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 86%; overflow-y: auto; z-index: 61; background: #232428; border-radius: 24px 24px 0 0; padding: 12px 24px 32px; display: flex; flex-direction: column; gap: 24px; animation: up .3s cubic-bezier(.2,.8,.2,1) both; color: var(--text); }
@keyframes up { from { transform: translateY(100%); } }
.sheet, .sheet *, .toast, .call, .call * { box-sizing: border-box; }
.sheet .group a, .sheet summary { color: var(--text); text-decoration: none; }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line-2); align-self: center; }

.sheet .row .code { width: 48px; flex: none; }
.testbtn { position: absolute; bottom: 44px; left: 12px; z-index: 30; padding: 4px 8px; border-radius: 12px; background: rgba(255,255,255,.14); color: var(--text); font: 500 12px/16px var(--font); border: 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; } }
